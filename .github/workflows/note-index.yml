# Rebuilds the note index. Manual only. Does not deploy and does not commit.
# This file has no push, pull_request, or schedule trigger. Do not add one.
# A weekly schedule can be added later if someone wants the index refreshed unattended.
name: Refresh note index

on:
  workflow_dispatch:

jobs:
  note-index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and the kit
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Build the note index
        run: python -m ncperf.noteindex --out note-index.json
      - name: Upload the index
        uses: actions/upload-artifact@v4
        with:
          name: note-index
          path: note-index.json
          if-no-files-found: error
