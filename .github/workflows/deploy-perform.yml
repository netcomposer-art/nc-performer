# Deploys the Perform Worker and container. Manual only.
# This file has no push or pull_request trigger. Do not add one.
name: Deploy Perform

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/worker/package-lock.json
      - name: Install Worker dependencies
        working-directory: service/worker
        run: npm ci
      - name: Deploy the Worker
        working-directory: service/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Set Worker secrets when the GitHub secrets exist
        working-directory: service/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NC_SIGNING_KEY: ${{ secrets.NC_SIGNING_KEY }}
        run: |
          set -euo pipefail
          put() {
            name="$1"
            val="${2:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$name"
              echo "Set Worker secret $name."
            else
              echo "Skipping $name (that GitHub secret is empty)."
            fi
          }
          put XAI_API_KEY "$XAI_API_KEY"
          put TURNSTILE_SECRET_KEY "$TURNSTILE_SECRET_KEY"
          put NC_SIGNING_KEY "$NC_SIGNING_KEY"
